# Build the Shinylive site and publish it to GitHub Pages.
# Requires: repository Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            cran::shinylive
            cran::shiny
            cran::bslib
            cran::ggplot2
            cran::png
            cran::testthat
      - name: Regression tests (fixture p-values must match)
        run: Rscript tests/run_tests.R
      - name: Export Shinylive site (adds page title and loading message)
        run: Rscript dev/export_site.R
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
